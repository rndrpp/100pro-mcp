[project]
name = "100pro-mcp"
version = "1.0.0"
description = "MCP stdio bridge + remote server for the 100pro Token Risk Screen (x402-paid, $0.05 USDC/call on Base)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "x402", "due-diligence", "token-risk", "honeypot", "solana", "base"]
dependencies = []

[project.scripts]
100pro-mcp = "100pro_mcp:main"

[project.urls]
Homepage = "https://x402.rendraputra.dev"
Repository = "https://github.com/rndrpp/100pro-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
